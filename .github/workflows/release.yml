name: Release preview manifest
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in manifest.json
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/package.py --version "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - name: Sign manifest (required)
        run: node scripts/sign.mjs
        env:
          APP_SIGNING_PRIVATE_KEY: ${{ secrets.APP_SIGNING_PRIVATE_KEY }}
      - name: Publish preview
        run: gh release create "v$VERSION" dist/manifest.json dist/manifest.json.sig dist/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "Flux $VERSION" --notes-file CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
